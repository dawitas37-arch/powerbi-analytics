onDays*x.RequestsCompleted,0)/done:0;return {rec,done,pending,over,quality,avg,rate:rec?done/rec:0,overRate:rec?over/rec:0}}function card(label,val,hint=''){return `<div class="card"><label>${label}</label><div class="value">${val}</div><div class="hint">${hint}</div></div>`}function panel(title,inner,desc=''){return `<section class="panel"><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}${inner}</section>`}function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}function group(rows,key){let d={};rows.forEach(x=>(d[x[key]]??=[]).push(x));return d}function overview(rows,m){let teams=group(rows,'Team'),regions=group(rows,'Region'),max=Math.max(1,...Object.values(teams).map(x=>total(x,'RequestsCompleted')));return `<div class="cards">${card('TOTAL REQUESTS',fmt(m.rec),'Incoming workload')}${card('COMPLETED REQUESTS',fmt(m.done),'Processed this period')}${card('COMPLETION RATE',pct(m.rate),'Completed / received')}${card('PENDING REQUESTS',fmt(m.pending),'Remaining workload')}</div><div class="layout">${panel('Completed Requests by Team',table(['Team','Completed','Share of volume'],Object.entries(teams).map(([k,v])=>{let n=total(v,'RequestsCompleted');return [k,fmt(n),`<div class="barwrap"><div class="bar" style="width:${n/max*100}%"></div></div>`]})),'Team-level processing volume')}${panel('Regional Summary',table(['Region','Received','Completed','Rate'],Object.entries(regions).map(([k,v])=>{let z=metrics(v);return[k,fmt(z.rec),fmt(z.done),pct(z.rate)]})))}<div class="wide">${panel('Completed Requests by Team and Service Category',table(['Team',...cats,'Total'],Object.entries(teams).map(([k,v])=>[k,...cats.map(c=>fmt(total(v.filter(x=>x.ServiceCategory===c),'RequestsCompleted'))),fmt(total(v,'RequestsCompleted'))])),'Matrix-style cross-tab for executive review')}</div></div>`}function detail(rows,m){let sorted=[...rows].sort
